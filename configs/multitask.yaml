project:
  name: "cityeye-multitask"

data:
  processed_dir: "data/processed"
  image_size: [640, 640]
  num_workers: 2

model:
  backbone: "resnet50"
  pretrained: true
  fpn_channels: 256

tasks:
  detection:
    enabled: true
    classes: ["car", "motorcycle", "bus", "truck", "bicycle", "auto", "pedestrian"]
  congestion:
    enabled: true
  violation:
    enabled: true
    types: ["no_helmet", "signal_jump", "wrong_way"]
  anomaly:
    enabled: true
    types: ["stopped_vehicle", "accident", "pedestrian_on_road"]

training:
  batch_size: 8
  epochs: 50
  lr: 0.0001
  weight_decay: 0.0001
  freeze_backbone_epochs: 5
  output_dir: "runs/checkpoints"
